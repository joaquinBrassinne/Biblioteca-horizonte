services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    image: biblioteca-postgres:latest
    container_name: biblioteca-postgres
    restart: always
    environment:
      POSTGRES_DB: biblioteca_horizonte
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
